    // ========== G-CODE GENERATION - FULL RELATIVE VECTOR ==========
    
    generateVectorGCode() {
        let gcode = [
            '; LaserCAM Pro v1.0 - FULL RELATIVE MODE',
            '; Home = Center of work area (0,0)',
            '; All movements are G91 (relative)',
            '; Generated: ' + new Date().toLocaleString(),
            '',
            'G17 G21',
            'G91',          // ⭐ SEMPRE RELATIVO
            'M5',
            '',
            'M3 S0',
            ''
        ];
        
        let lastX = 0, lastY = 0; // Partiamo da 0,0
        let totalDist = 0;
        
        const mirrorX = document.getElementById('mirrorX').checked;
        const mirrorY = document.getElementById('mirrorY').checked;
        
        this.objects.forEach(obj => {
            if (!['vector', 'vectorText'].includes(obj.type) || !obj.paths.length) return;
            
            const sVal = Math.round(obj.power / 100 * 1000);
            gcode.push(`; Object: ${obj.name}`);
            gcode.push(`; Power: ${obj.power}%, Speed: ${obj.speed}mm/min, Passes: ${obj.passes}`);
            gcode.push(`F${obj.speed}`);
            
            const transformedPaths = obj.getTransformedPaths();
            
            for (let pass = 0; pass < obj.passes; pass++) {
                if (obj.passes > 1) gcode.push(`; Pass ${pass + 1}/${obj.passes}`);
                
                transformedPaths.forEach(path => {
                    if (path.length < 2) return;
                    
                    // Coordinate assolute relative al centro
                    let firstX = obj.x + path[0].x * obj.w;
                    let firstY = obj.y + path[0].y * obj.h;
                    
                    if (mirrorX) firstX = -firstX;
                    if (mirrorY) firstY = -firstY;
                    
                    // ⭐ Movimento RELATIVO verso primo punto
                    let dx = firstX - lastX;
                    let dy = firstY - lastY;
                    
                    if (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001) {
                        gcode.push(`G0 X${dx.toFixed(3)} Y${dy.toFixed(3)} S0`);
                        totalDist += Math.sqrt(dx*dx + dy*dy);
                    }
                    
                    lastX = firstX;
                    lastY = firstY;
                    
                    // Incisione path
                    for (let i = 1; i < path.length; i++) {
                        let absX = obj.x + path[i].x * obj.w;
                        let absY = obj.y + path[i].y * obj.h;
                        
                        if (mirrorX) absX = -absX;
                        if (mirrorY) absY = -absY;
                        
                        dx = absX - lastX;
                        dy = absY - lastY;
                        
                        const power = (i === 1 || i === path.length - 1) ? 0 : sVal;
                        
                        if (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001) {
                            gcode.push(`G1 X${dx.toFixed(3)} Y${dy.toFixed(3)} S${power}`);
                            totalDist += Math.sqrt(dx*dx + dy*dy);
                        }
                        
                        lastX = absX;
                        lastY = absY;
                    }
                    
                    gcode.push(`G1 X0 Y0 S0`);
                });
            }
            gcode.push('');
        });

        // ⭐ Ritorno a home (0,0)
        const dxHome = -lastX;
        const dyHome = -lastY;
        
        gcode.push('; Return to home (0,0)');
        gcode.push('M5');
        gcode.push('F3000');
        if (Math.abs(dxHome) > 0.001 || Math.abs(dyHome) > 0.001) {
            gcode.push(`G0 X${dxHome.toFixed(3)} Y${dyHome.toFixed(3)}`);
        }
        gcode.push('M2');
        
        return { code: gcode.join('\n'), lines: gcode.length, dist: totalDist };
    }

    // ========== G-CODE GENERATION - FULL RELATIVE RASTER ==========
    
    generateRasterGCode() {
        let gcode = [
            '; LaserCAM Pro v1.0 - RASTER FULL RELATIVE',
            `; Resolution: ${this.rasterRes} lines/mm`,
            '; Home = Center (0,0)',
            '; Generated: ' + new Date().toLocaleString(),
            '',
            'G17 G21',
            'G91',
            'M5',
            '',
            'M3 S0',
            ''
        ];
        
        let lastX = 0, lastY = 0;
        let totalDist = 0;
        const res = this.rasterRes;
        
        const mirrorX = document.getElementById('mirrorX').checked;
        const mirrorY = document.getElementById('mirrorY').checked;
        
        this.objects.forEach(obj => {
            if (!['image', 'text'].includes(obj.type) || !obj.image) return;
            
            const sVal = Math.round(obj.power / 100 * 1000);
            gcode.push(`; Object: ${obj.name}`);
            gcode.push(`F${obj.speed}`);
            
            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(obj.w * res);
            canvas.height = Math.ceil(obj.h * res);
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(obj.rotation * Math.PI / 180);
            ctx.scale(obj.flipH ? -1 : 1, obj.flipV ? -1 : 1);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);
            ctx.drawImage(obj.image, 0, 0, canvas.width, canvas.height);
            ctx.restore();
            
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            const lineSpacing = 1 / res;

            for (let row = 0; row < canvas.height; row++) {
                let y = obj.y + row * lineSpacing;
                if (mirrorY) y = -y;
                
                const reverse = this.rasterBidir && row % 2 === 1;
                let segments = [], inSeg = false, segStart = 0;
                
                const start = reverse ? canvas.width - 1 : 0;
                const end = reverse ? -1 : canvas.width;
                const step = reverse ? -1 : 1;

                for (let col = start; col !== end; col += step) {
                    const idx = (row * canvas.width + col) * 4;
                    const gray = d[idx] * 0.299 + d[idx+1] * 0.587 + d[idx+2] * 0.114;
                    const black = gray < 128;
                    if (black && !inSeg) { segStart = col; inSeg = true; }
                    else if (!black && inSeg) { segments.push({ s: segStart, e: col - step }); inSeg = false; }
                }
                if (inSeg) segments.push({ s: segStart, e: reverse ? 0 : canvas.width - 1 });

                segments.forEach(seg => {
                    let x1 = obj.x + Math.min(seg.s, seg.e) * lineSpacing;
                    let x2 = obj.x + Math.max(seg.s, seg.e) * lineSpacing;
                    
                    if (mirrorX) {
                        const tmp = -x2;
                        x2 = -x1;
                        x1 = tmp;
                    }
                    
                    // ⭐ Movimento RELATIVO verso inizio segmento
                    let dxStart = x1 - lastX;
                    let dyStart = y - lastY;
                    
                    if (Math.abs(dxStart) > 0.001 || Math.abs(dyStart) > 0.001) {
                        gcode.push(`G0 X${dxStart.toFixed(3)} Y${dyStart.toFixed(3)} S0`);
                        totalDist += Math.sqrt(dxStart*dxStart + dyStart*dyStart);
                    }
                    lastX = x1;
                    lastY = y;
                    
                    // Incisione RELATIVA
                    const dxBurn = x2 - x1;
                    if (Math.abs(dxBurn) > 0.001) {
                        gcode.push(`G1 X${dxBurn.toFixed(3)} Y0 S${sVal}`);
                        gcode.push(`G1 X0 Y0 S0`);
                        totalDist += Math.abs(dxBurn);
                    }
                    lastX = x2;
                });
            }
            gcode.push('');
        });
        
        // ⭐ Ritorno a home
        const dxHome = -lastX;
        const dyHome = -lastY;
        
        gcode.push('M5');
        gcode.push('F3000');
        if (Math.abs(dxHome) > 0.001 || Math.abs(dyHome) > 0.001) {
            gcode.push(`G0 X${dxHome.toFixed(3)} Y${dyHome.toFixed(3)}`);
        }
        gcode.push('M2');
        
        return { code: gcode.join('\n'), lines: gcode.length, dist: totalDist };
    }

    showGCode(mode = 'vector') {
        if (!this.objects.length) { this.log(t('msg_no_objects'), 'err'); return; }
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === mode));
        
        const result = mode === 'raster' ? this.generateRasterGCode() : this.generateVectorGCode();
        document.getElementById('gcodeOutput').value = result.code;
        document.getElementById('gcodeLines').textContent = result.lines;
        document.getElementById('gcodeDist').textContent = result.dist.toFixed(0);
        
        const avgSpeed = 1500;
        const timeMin = (result.dist / avgSpeed) + (result.lines * 0.001);
        document.getElementById('gcodeTime').textContent = timeMin.toFixed(1);
        
        openModal('modalGcode');
        this.log(`G-Code generated (${mode}): ${result.lines} lines`);

        document.getElementById('btnCopyGcode').onclick = () => { 
            navigator.clipboard.writeText(result.code); 
            this.log('📋 Copied to clipboard'); 
        };
        document.getElementById('btnDownloadGcode').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([result.code], { type: 'text/plain' }));
            a.download = `laser_${mode}_${Date.now()}.gcode`;
            a.click();
            this.log('💾 Downloaded');
        };
        document.getElementById('btnSendGcode').onclick = () => { 
            closeModal('modalGcode'); 
            this.startJobWithCode(result.code); 
        };
    }

    // ========== FRAME JOB - FULL RELATIVE ==========
    
    async frameJob() {
        if (!this.connected) { this.log('❌ Not connected', 'err'); return; }
        
        if (!this.objects.length) {
            this.log('❌ No objects to frame', 'err');
            return;
        }
        
        // Bounds degli oggetti (coordinate relative al centro)
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        this.objects.forEach(o => { 
            minX = Math.min(minX, o.x); 
            minY = Math.min(minY, o.y); 
            maxX = Math.max(maxX, o.x + o.w); 
            maxY = Math.max(maxY, o.y + o.h); 
        });
        
        const mirrorX = document.getElementById('mirrorX').checked;
        const mirrorY = document.getElementById('mirrorY').checked;
        
        if (mirrorX) {
            const tmp = -maxX;
            maxX = -minX;
            minX = tmp;
        }
        if (mirrorY) {
            const tmp = -maxY;
            maxY = -minY;
            minY = tmp;
        }
        
        const w = maxX - minX;
        const h = maxY - minY;
        
        this.log(`🔲 Framing job (${w.toFixed(1)} x ${h.toFixed(1)} mm)`);
        
        await this.send('G91');
        await this.send('M3 S5');
        await this.send('F3000');
        
        // ⭐ Tutti movimenti RELATIVI da posizione corrente (0,0 se siamo a home)
        // Vai al primo angolo (relativo da 0,0)
        await this.send(`G0 X${minX.toFixed(2)} Y${minY.toFixed(2)}`);
        await this.delay(200);
        
        // Rettangolo
        await this.send(`G0 X${w.toFixed(2)} Y0`);
        await this.delay(200);
        await this.send(`G0 X0 Y${h.toFixed(2)}`);
        await this.delay(200);
        await this.send(`G0 X${(-w).toFixed(2)} Y0`);
        await this.delay(200);
        await this.send(`G0 X0 Y${(-h).toFixed(2)}`);
        await this.delay(200);
        
        await this.send('M5');
        
        // ⭐ Torna a 0,0 (movimento inverso del primo)
        await this.send(`G0 X${(-minX).toFixed(2)} Y${(-minY).toFixed(2)}`);
        
        this.log('✅ Frame complete, returned to home');
    }

    // ========== SERIAL COMMUNICATION ==========
    
    async toggleConnection() {
        if (this.connected) await this.disconnect();
        else await this.connect();
    }

    async connect() {
        try {
            if (!('serial' in navigator)) { 
                alert('⚠️ Web Serial API not supported. Use Chrome/Edge.'); 
                return; 
            }
            this.port = await navigator.serial.requestPort();
            await this.port.open({ baudRate: +document.getElementById('baudRate').value });
            this.connected = true;
            document.getElementById('status').classList.add('on');
            document.getElementById('statusTxt').textContent = t('status_connected');
            document.getElementById('btnConn').textContent = t('btn_disconnect');
            this.log('✅ Connected');
            this.startReading();
            
            this.startPositionPolling();
            
            await this.delay(1000);
            await this.send('$X'); // Unlock GRBL
            await this.delay(200);
            await this.send('?'); // Query status
        } catch (err) { 
            this.log('❌ Connection error: ' + err.message, 'err'); 
        }
    }

    async disconnect() {
        this.jobRunning = false;
        this.stopPositionPolling();
        
        await this.send('M5');
        if (this.reader) { 
            try { await this.reader.cancel(); } catch(e) {} 
            this.reader = null; 
        }
        if (this.port) { 
            try { await this.port.close(); } catch(e) {} 
            this.port = null; 
        }
        this.connected = false;
        document.getElementById('status').classList.remove('on');
        document.getElementById('statusTxt').textContent = t('status_disconnected');
        document.getElementById('btnConn').textContent = t('btn_connect');
        this.log('🔌 Disconnected');
    }

    startPositionPolling() {
        this.stopPositionPolling();
        this.positionUpdateInterval = setInterval(() => {
            if (this.connected && !this.jobRunning) {
                this.send('?');
            }
        }, 250);
    }

    stopPositionPolling() {
        if (this.positionUpdateInterval) {
            clearInterval(this.positionUpdateInterval);
            this.positionUpdateInterval = null;
        }
    }

    async startReading() {
        while (this.port?.readable) {
            try {
                this.reader = this.port.readable.getReader();
                let buffer = '';
                while (true) {
                    const { value, done } = await this.reader.read();
                    if (done) break;
                    buffer += new TextDecoder().decode(value);
                    const lines = buffer.split('\n'); 
                    buffer = lines.pop();
                    lines.forEach(l => { 
                        l = l.trim(); 
                        if (l) this.handleResponse(l); 
                    });
                }
            } catch (err) { 
                if (err.name !== 'CancelledError') 
                    this.log('❌ Read error: ' + err.message, 'err'); 
            }
            finally { 
                this.reader?.releaseLock(); 
            }
        }
    }

    handleResponse(line) {
        this.log('< ' + line, 'recv');
        
        // Parse posizione da status GRBL
        const mposMatch = line.match(/[MW]Pos:([-\d.]+),([-\d.]+)/);
        if (mposMatch) { 
            this.currentPosition = { 
                x: parseFloat(mposMatch[1]), 
                y: parseFloat(mposMatch[2]) 
            };
            this.positionKnown = true;
            this.updateCurrentPosDisplay();
            this.render();
        }
    }

    async send(cmd) {
        if (!this.connected || !this.port) return false;
        try {
            const w = this.port.writable.getWriter();
            await w.write(new TextEncoder().encode(cmd + '\n'));
            w.releaseLock();
            if (cmd.trim() && cmd !== '?') this.log('> ' + cmd, 'send');
            return true;
        } catch (err) { 
            this.log('❌ Send error: ' + err.message, 'err'); 
            return false; 
        }
    }

    sendManual() {
        const input = document.getElementById('consoleInput');
        if (input.value.trim()) { 
            this.send(input.value.trim()); 
            input.value = ''; 
        }
    }

    async emergencyStop() {
        this.log('🚨 EMERGENCY STOP', 'err');
        this.jobRunning = false;
        this.stopSimulation();
        if (this.port?.writable) {
            const w = this.port.writable.getWriter();
            await w.write(new TextEncoder().encode('\x18'));
            w.releaseLock();
        }
        await this.send('M5');
        await this.send('$X');
        document.getElementById('btnStart').disabled = false;
        document.getElementById('progBar').style.width = '0%';
        document.getElementById('footProg').textContent = '0%';
    }

    async startJob() { 
        await this.startJobWithCode(this.generateVectorGCode().code); 
    }

    async startJobWithCode(code) {
        if (!this.connected) { 
            this.log('❌ Not connected', 'err'); 
            return; 
        }
        
        // ⭐ Verifica posizione home
        if (this.positionKnown && (Math.abs(this.currentPosition.x) > 0.1 || Math.abs(this.currentPosition.y) > 0.1)) {
            if (!confirm('⚠️ Laser is not at home (0,0). Go to home first?')) {
                return;
            }
            await this.goHome();
            await this.delay(500);
        }
        
        this.jobQueue = code.split('\n').filter(l => l.trim() && !l.startsWith(';'));
        this.jobRunning = true;
        this.jobPaused = false;
        document.getElementById('btnStart').disabled = true;
        this.stopPositionPolling();
        this.log('▶️ Starting job...');

        for (let i = 0; i < this.jobQueue.length && this.jobRunning; i++) {
            while (this.jobPaused) await this.delay(100);
            await this.send(this.jobQueue[i]);
            await this.delay(10);
            const p = ((i + 1) / this.jobQueue.length) * 100;
            document.getElementById('progBar').style.width = p + '%';
            document.getElementById('footProg').textContent = Math.round(p) + '%';
        }

        this.jobRunning = false;
        document.getElementById('btnStart').disabled = false;
        this.startPositionPolling();
        
        // Dopo job, siamo tornati a 0,0
        this.currentPosition = { x: 0, y: 0 };
        this.updateCurrentPosDisplay();
        this.log('✅ Job complete!');
        this.render();
    }

    togglePause() {
        if (!this.jobRunning) return;
        this.jobPaused = !this.jobPaused;
        this.send(this.jobPaused ? '!' : '~');
        document.getElementById('btnPause').textContent = this.jobPaused ? t('btn_resume') : t('btn_pause');
        this.log(this.jobPaused ? '⏸️ Paused' : '▶️ Resumed');
    }

    jog(dir) {
        if (!this.connected) return;
        
        if (dir === 'H') { 
            this.goHome(); 
            return; 
        }
        
        const step = this.jogStep;
        let dx = 0, dy = 0;
        
        if (dir === 'X+') dx = step;
        else if (dir === 'X-') dx = -step;
        else if (dir === 'Y+') dy = step;
        else if (dir === 'Y-') dy = -step;
        
        this.send(`$J=G91 X${dx} Y${dy} F3000`);
        
        // ⭐ Aggiorna tracking
        this.currentPosition.x += dx;
        this.currentPosition.y += dy;
        this.positionKnown = true;
        this.updateCurrentPosDisplay();
        this.render();
    }

    // ========== CONTEXT MENU ==========
    
    onContextMenu(e) {
        e.preventDefault();
        const rect = this.canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const scale = this.ppm * this.zoom;
        
        // ⭐ Coordinate relative al centro
        const mx = (mouseX - this.pan.x) / scale;
        const my = (mouseY - this.pan.y) / scale;

        this.contextMenuPos = { x: mx, y: my };

        let clickedObj = null;
        for (let i = this.objects.length - 1; i >= 0; i--) {
            if (this.objects[i].contains(mx, my)) { clickedObj = this.objects[i]; break; }
        }

        this.contextMenuTarget = clickedObj;
        
        const menu = document.getElementById('contextMenu');
        menu.style.left = e.clientX + 'px';
        menu.style.top = e.clientY + 'px';
        
        menu.querySelectorAll('.context-menu-item').forEach(item => {
            const action = item.dataset.action;
            item.classList.remove('disabled');
            
            if (['delete', 'duplicate', 'center', 'rotateCW', 'rotateCCW', 'flipH', 'flipV'].includes(action) && !clickedObj) item.classList.add('disabled');
            if (action === 'vectorize' && (!clickedObj || !['image', 'text'].includes(clickedObj.type))) item.classList.add('disabled');
            if (action === 'rasterGcode' && (!clickedObj || !['image', 'text'].includes(clickedObj.type))) item.classList.add('disabled');
            if (action === 'editPaths' && (!clickedObj || !['vector', 'vectorText'].includes(clickedObj.type))) item.classList.add('disabled');
            if (['goHome', 'frame'].includes(action) && !this.connected) item.classList.add('disabled');
        });
        
        menu.classList.add('show');
    }

    hideContextMenu() {
        document.getElementById('contextMenu').classList.remove('show');
    }

    handleContextAction(action) {
        this.hideContextMenu();
        
        switch(action) {
            case 'select': if (this.contextMenuTarget) this.selectObj(this.contextMenuTarget.id); break;
            case 'selectAll': this.selectAll(); break;
            case 'duplicate': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.duplicateSelected(); } break;
            case 'delete': if (this.contextMenuTarget) this.deleteObj(this.contextMenuTarget.id); break;
            case 'rotateCW': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.rotateSelected(90); } break;
            case 'rotateCCW': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.rotateSelected(-90); } break;
            case 'flipH': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.flipSelected('h'); } break;
            case 'flipV': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.flipSelected('v'); } break;
            case 'vectorize': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.vectorize(); } break;
            case 'rasterGcode': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.showGCode('raster'); } break;
            case 'editPaths': if (this.contextMenuTarget) { this.selectObj(this.contextMenuTarget.id); this.enterEditMode(); } break;
            case 'gcode': this.showGCode('vector'); break;
            case 'simulate': this.startSimulation(); break;
            case 'frame': this.frameJob(); break;
            case 'center': if (this.contextMenuTarget) this.centerObject(this.contextMenuTarget); break;
            case 'goHome': this.goHome(); break;
        }
    }

    centerObject(obj) {
        // ⭐ Centra oggetto a 0,0
        obj.x = -obj.w / 2;
        obj.y = -obj.h / 2;
        this.updatePropsDisplay();
        this.render();
        this.log('🎯 Centered at (0,0)');
    }

    // ========== TRASFORMAZIONI ==========
    
    rotateSelected(degrees) {
        if (!this.selected) return;
        this.selected.rotation = (this.selected.rotation + degrees + 360) % 360;
        document.getElementById('propRot').value = this.selected.rotation;
        document.getElementById('rotVal').textContent = this.selected.rotation;
        this.render();
        this.log(`↻ Rotated ${this.selected.rotation}°`);
    }

    setRotation(degrees) {
        if (!this.selected) return;
        this.selected.rotation = degrees;
        document.getElementById('propRot').value = degrees;
        document.getElementById('rotVal').textContent = degrees;
        this.render();
    }

    flipSelected(axis) {
        if (!this.selected) return;
        if (axis === 'h') {
            this.selected.flipH = !this.selected.flipH;
            this.log('⇄ Flipped horizontally');
        } else {
            this.selected.flipV = !this.selected.flipV;
            this.log('⇅ Flipped vertically');
        }
        this.render();
    }
        // ========== PATH EDITING ==========
    
    enterEditMode() {
        if (!this.selected || !['vector', 'vectorText'].includes(this.selected.type)) {
            this.log('⚠️ Select a vector object first', 'err');
            return;
        }
        this.editMode = true;
        this.editingObject = this.selected;
        this.editingObject.selectedPathIndex = -1;
        document.getElementById('editModeBar').classList.add('show');
        document.getElementById('pathEditSection').style.display = 'block';
        this.updatePathList();
        this.render();
    }

    exitEditMode() {
        this.editMode = false;
        if (this.editingObject) this.editingObject.selectedPathIndex = -1;
        this.editingObject = null;
        document.getElementById('editModeBar').classList.remove('show');
        document.getElementById('pathEditSection').style.display = 'none';
        this.render();
    }

    updatePathList() {
        if (!this.editingObject) return;
        document.getElementById('pathList').innerHTML = this.editingObject.paths.map((path, i) => {
            const len = this.pathLength(path) * Math.max(this.editingObject.w, this.editingObject.h);
            const color = this.pathColors[i % this.pathColors.length];
            return `
                <div class="path-item ${this.editingObject.selectedPathIndex === i ? 'selected' : ''}" onclick="app.selectPath(${i})">
                    <div style="display:flex; align-items:center">
                        <div class="path-color" style="background:${color}"></div>
                        #${i+1} (${len.toFixed(1)}mm)
                    </div>
                    <button class="path-del" onclick="event.stopPropagation(); app.deletePath(${i})">×</button>
                </div>
            `;
        }).join('');
    }

    selectPath(i) {
        if (!this.editingObject) return;
        this.editingObject.selectedPathIndex = i;
        this.updatePathList();
        this.render();
    }

    deletePath(i) {
        if (!this.editingObject) return;
        this.editingObject.paths.splice(i, 1);
        this.editingObject.selectedPathIndex = -1;
        this.updatePathList();
        this.render();
        this.log(`🗑️ Path #${i + 1} deleted`);
    }

    deleteSelectedPath() {
        if (this.editingObject?.selectedPathIndex >= 0) this.deletePath(this.editingObject.selectedPathIndex);
    }

    deleteSmallPaths() {
        if (!this.editingObject) return;
        const before = this.editingObject.paths.length;
        this.editingObject.paths = this.editingObject.paths.filter(p => 
            this.pathLength(p) * Math.max(this.editingObject.w, this.editingObject.h) >= 3
        );
        const removed = before - this.editingObject.paths.length;
        this.editingObject.selectedPathIndex = -1;
        this.updatePathList();
        this.render();
        this.log(`🗑️ Removed ${removed} small paths`);
    }

    pathLength(path) {
        let len = 0;
        for (let i = 1; i < path.length; i++) {
            len += Math.sqrt((path[i].x - path[i-1].x)**2 + (path[i].y - path[i-1].y)**2);
        }
        return len;
    }

    // ========== MOUSE EVENTS ==========
    
    onMouseDown(e) {
        if (e.button === 2) return;
        
        const rect = this.canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const scale = this.ppm * this.zoom;
        
        // ⭐ Coordinate relative al centro
        const mx = (mouseX - this.pan.x) / scale;
        const my = (mouseY - this.pan.y) / scale;

        if (this.editMode && this.editingObject) {
            const pathIndex = this.editingObject.findPathAtPoint(mx, my, 5 / scale);
            if (pathIndex >= 0) {
                this.editingObject.selectedPathIndex = pathIndex;
                this.updatePathList();
                this.render();
                return;
            }
        }

        if (this.selected && !this.editMode) {
            for (const h of this.selected.getHandles(this.zoom, this.pan, this.ppm)) {
                if (mouseX >= h.x && mouseX <= h.x + 8 && mouseY >= h.y && mouseY <= h.y + 8) {
                    this.resizing = true;
                    this.resizeHandle = h.id;
                    this.resizeStart = { mouseX, mouseY, x: this.selected.x, y: this.selected.y, w: this.selected.w, h: this.selected.h };
                    return;
                }
            }
        }

        let clickedObj = null;
        for (let i = this.objects.length - 1; i >= 0; i--) {
            if (this.objects[i].contains(mx, my)) { clickedObj = this.objects[i]; break; }
        }

        if (!this.editMode) {
            this.objects.forEach(o => o.selected = false);
            if (clickedObj) {
                clickedObj.selected = true;
                this.selected = clickedObj;
                this.dragging = true;
                this.dragStart = { x: mx - clickedObj.x, y: my - clickedObj.y };
                this.updateProps();
            } else {
                this.selected = null;
                document.getElementById('propSec').style.display = 'none';
                document.getElementById('vecSection').style.display = 'none';
                document.getElementById('rasterSection').style.display = 'none';
            }
        }
        
        this.render();
        this.updateObjList();
    }

    onMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const scale = this.ppm * this.zoom;
        const mx = (mouseX - this.pan.x) / scale;
        const my = (mouseY - this.pan.y) / scale;

        document.getElementById('cursorPos').textContent = `${mx.toFixed(1)}, ${my.toFixed(1)} mm`;

        if (this.resizing && this.selected) {
            const dx = (mouseX - this.resizeStart.mouseX) / scale;
            const dy = (mouseY - this.resizeStart.mouseY) / scale;
            const lock = document.getElementById('lockRatio').checked;
            const aspect = this.resizeStart.w / this.resizeStart.h;
            
            let newX = this.resizeStart.x, newY = this.resizeStart.y;
            let newW = this.resizeStart.w, newH = this.resizeStart.h;

            if (this.resizeHandle === 'br') { newW = Math.max(5, this.resizeStart.w + dx); newH = lock ? newW / aspect : Math.max(5, this.resizeStart.h + dy); }
            else if (this.resizeHandle === 'bl') { newW = Math.max(5, this.resizeStart.w - dx); newX = this.resizeStart.x + this.resizeStart.w - newW; newH = lock ? newW / aspect : Math.max(5, this.resizeStart.h + dy); }
            else if (this.resizeHandle === 'tr') { newW = Math.max(5, this.resizeStart.w + dx); newH = lock ? newW / aspect : Math.max(5, this.resizeStart.h - dy); newY = this.resizeStart.y + this.resizeStart.h - newH; }
            else if (this.resizeHandle === 'tl') { newW = Math.max(5, this.resizeStart.w - dx); newH = lock ? newW / aspect : Math.max(5, this.resizeStart.h - dy); newX = this.resizeStart.x + this.resizeStart.w - newW; newY = this.resizeStart.y + this.resizeStart.h - newH; }

            this.selected.x = newX; this.selected.y = newY; this.selected.w = newW; this.selected.h = newH;
            this.updatePropsDisplay();
            this.render();
            return;
        }

        if (this.dragging && this.selected) {
            this.selected.x = mx - this.dragStart.x;
            this.selected.y = my - this.dragStart.y;
            this.updatePropsDisplay();
            this.render();
            return;
        }

        this.canvas.style.cursor = this.editMode ? 'crosshair' : 'default';
        if (this.selected && !this.editMode) {
            for (const h of this.selected.getHandles(this.zoom, this.pan, this.ppm)) {
                if (mouseX >= h.x && mouseX <= h.x + 8 && mouseY >= h.y && mouseY <= h.y + 8) {
                    this.canvas.style.cursor = h.cursor;
                    return;
                }
            }
            if (this.selected.contains(mx, my)) this.canvas.style.cursor = 'move';
        }
    }

    onMouseUp() { this.dragging = false; this.resizing = false; }

    onWheel(e) {
        e.preventDefault();
        const oldZoom = this.zoom;
        this.zoom *= e.deltaY > 0 ? 0.9 : 1.1;
        this.zoom = Math.max(0.2, Math.min(5, this.zoom));
        
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        
        this.pan.x = mx - (mx - this.pan.x) * (this.zoom / oldZoom);
        this.pan.y = my - (my - this.pan.y) * (this.zoom / oldZoom);
        
        this.render();
    }

    // ========== OBJECT MANAGEMENT ==========
    
    updateObjList() {
        document.getElementById('objList').innerHTML = this.objects.map(obj => `
            <div class="obj-item ${obj.selected ? 'sel' : ''}" onclick="app.selectObj('${obj.id}')">
                <div>
                    <span>${obj.type === 'image' ? '🖼️' : obj.type === 'text' ? '📝' : obj.type === 'vectorText' ? '🔤' : '✏️'}</span>
                    ${obj.name.substring(0, 12)}
                    <div style="font-size:9px; color:#6c7a89">${obj.w.toFixed(0)}×${obj.h.toFixed(0)}mm ${obj.rotation ? obj.rotation + '°' : ''}</div>
                </div>
                <button class="obj-del" onclick="event.stopPropagation(); app.deleteObj('${obj.id}')">×</button>
            </div>
        `).join('');
    }

    selectObj(id) {
        if (this.editMode) this.exitEditMode();
        this.objects.forEach(o => o.selected = (o.id === id));
        this.selected = this.objects.find(o => o.id === id);
        if (this.selected) this.updateProps();
        this.render();
        this.updateObjList();
    }

    deleteObj(id) {
        this.objects = this.objects.filter(o => o.id !== id);
        if (this.selected?.id === id) {
            this.selected = null;
            document.getElementById('propSec').style.display = 'none';
            document.getElementById('vecSection').style.display = 'none';
            document.getElementById('rasterSection').style.display = 'none';
        }
        if (this.editMode) this.exitEditMode();
        this.render();
        this.updateObjList();
        this.log('🗑️ Object deleted');
    }

    updateProps() {
        if (!this.selected) return;
        document.getElementById('propSec').style.display = 'block';
        this.updatePropsDisplay();
        document.getElementById('propPwr').value = this.selected.power;
        document.getElementById('propSpd').value = this.selected.speed;
        document.getElementById('propPass').value = this.selected.passes;
        document.getElementById('propRot').value = this.selected.rotation;
        document.getElementById('pwrVal').textContent = this.selected.power;
        document.getElementById('spdVal').textContent = this.selected.speed;
        document.getElementById('rotVal').textContent = this.selected.rotation;
        
        const isImage = ['image', 'text'].includes(this.selected.type) && this.selected.image;
        document.getElementById('vecSection').style.display = isImage ? 'block' : 'none';
        document.getElementById('rasterSection').style.display = isImage ? 'block' : 'none';
    }

    updatePropsDisplay() {
        if (!this.selected) return;
        document.getElementById('propX').value = this.selected.x.toFixed(1);
        document.getElementById('propY').value = this.selected.y.toFixed(1);
        document.getElementById('propW').value = this.selected.w.toFixed(1);
        document.getElementById('propH').value = this.selected.h.toFixed(1);
    }

    applyProps() {
        if (!this.selected) return;
        this.selected.x = +document.getElementById('propX').value;
        this.selected.y = +document.getElementById('propY').value;
        this.selected.w = +document.getElementById('propW').value;
        this.selected.h = +document.getElementById('propH').value;
        this.render();
    }

    deleteSelected() { if (this.selected) this.deleteObj(this.selected.id); }
    
    duplicateSelected() {
        if (!this.selected) return;
        const copy = this.selected.clone();
        this.objects.push(copy);
        this.objects.forEach(o => o.selected = false);
        copy.selected = true;
        this.selected = copy;
        this.updateProps();
        this.render();
        this.updateObjList();
        this.log('📋 Duplicated');
    }
    
    selectAll() { this.objects.forEach(o => o.selected = true); this.render(); this.updateObjList(); }
    
    clearAll() {
        if (!confirm('Delete all objects?')) return;
        this.objects = [];
        this.selected = null;
        if (this.editMode) this.exitEditMode();
        document.getElementById('propSec').style.display = 'none';
        document.getElementById('vecSection').style.display = 'none';
        document.getElementById('rasterSection').style.display = 'none';
        this.render();
        this.updateObjList();
    }
    
    zoomFit() { 
        this.zoom = 1;
        this.pan = {
            x: (this.canvas.width + RULER_SIZE) / 2,
            y: (this.canvas.height + RULER_SIZE) / 2
        };
        this.render(); 
    }

    // ========== SIMULATION ==========
    
    startSimulation() {
        const simPoints = [];
        let hasVector = false, hasRaster = false;
        
        const mirrorX = document.getElementById('mirrorX').checked;
        const mirrorY = document.getElementById('mirrorY').checked;
        
        this.objects.forEach(obj => {
            if (['vector', 'vectorText'].includes(obj.type) && obj.paths.length) {
                hasVector = true;
                const transformedPaths = obj.getTransformedPaths();
                
                for (let pass = 0; pass < obj.passes; pass++) {
                    transformedPaths.forEach(path => {
                        if (path.length < 2) return;
                        
                        let x = obj.x + path[0].x * obj.w;
                        let y = obj.y + path[0].y * obj.h;
                        if (mirrorX) x = -x;
                        if (mirrorY) y = -y;
                        
                        simPoints.push({ x, y, laserOn: false });
                        
                        for (let i = 1; i < path.length; i++) {
                            let px = obj.x + path[i].x * obj.w;
                            let py = obj.y + path[i].y * obj.h;
                            if (mirrorX) px = -px;
                            if (mirrorY) py = -py;
                            simPoints.push({ x: px, y: py, laserOn: true });
                        }
                    });
                }
            }
        });
        
        this.objects.forEach(obj => {
            if (['image', 'text'].includes(obj.type) && obj.image) {
                hasRaster = true;
                const res = this.rasterRes;
                
                const canvas = document.createElement('canvas');
                canvas.width = Math.ceil(obj.w * res);
                canvas.height = Math.ceil(obj.h * res);
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(obj.rotation * Math.PI / 180);
                ctx.scale(obj.flipH ? -1 : 1, obj.flipV ? -1 : 1);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
                ctx.drawImage(obj.image, 0, 0, canvas.width, canvas.height);
                ctx.restore();
                
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imgData.data;
                const lineSpacing = 1 / res;

                const simStep = Math.max(1, Math.floor(canvas.height / 100));
                
                for (let row = 0; row < canvas.height; row += simStep) {
                    let y = obj.y + row * lineSpacing;
                    if (mirrorY) y = -y;
                    
                    const reverse = this.rasterBidir && (row / simStep) % 2 === 1;
                    let inBlack = false;
                    
                    const start = reverse ? canvas.width - 1 : 0;
                    const end = reverse ? -1 : canvas.width;
                    const step = reverse ? -1 : 1;

                    for (let col = start; col !== end; col += step) {
                        const idx = (row * canvas.width + col) * 4;
                        const gray = d[idx] * 0.299 + d[idx+1] * 0.587 + d[idx+2] * 0.114;
                        const black = gray < 128;
                        
                        if (black && !inBlack) {
                            inBlack = true;
                            let x = obj.x + col * lineSpacing;
                            if (mirrorX) x = -x;
                            simPoints.push({ x, y, laserOn: false });
                        } else if (!black && inBlack) {
                            let x = obj.x + (col - step) * lineSpacing;
                            if (mirrorX) x = -x;
                            simPoints.push({ x, y, laserOn: true });
                            inBlack = false;
                        }
                    }
                    if (inBlack) {
                        let x = obj.x + (reverse ? 0 : canvas.width - 1) * lineSpacing;
                        if (mirrorX) x = -x;
                        simPoints.push({ x, y, laserOn: true });
                    }
                }
            }
        });
        
        if (!simPoints.length) { this.log('⚠️ Nothing to simulate', 'err'); return; }
        
        this.simMode = hasVector && !hasRaster ? 'Vector' : !hasVector && hasRaster ? 'Raster' : 'Mixed';
        document.getElementById('simMode').textContent = this.simMode;
        
        this.simData = { points: simPoints, currentPoint: simPoints[0], laserOn: false, progress: 0 };
        this.simCurrentIndex = 0;
        this.simulating = true;
        this.simPaused = false;
        this.simStartTime = Date.now();
        
        document.getElementById('simOverlay').classList.add('show');
        document.getElementById('btnSimPause').textContent = '⏸';
        this.log('🎬 Simulation started');
        this.animateSimulation();
    }

    animateSimulation() {
        if (!this.simulating) return;
        if (this.simPaused) { 
            this.simAnimationId = requestAnimationFrame(() => this.animateSimulation()); 
            return; 
        }
        
        const pts = this.simData.points;
        if (this.simCurrentIndex >= pts.length - 1) {
            this.simulating = false;
            document.getElementById('simOverlay').classList.remove('show');
            this.log('✅ Simulation complete');
            this.render();
            return;
        }
        
        const idx = Math.floor(this.simCurrentIndex);
        const t = this.simCurrentIndex - idx;
        const p1 = pts[idx], p2 = pts[Math.min(idx + 1, pts.length - 1)];
        
        this.simData.currentPoint = { 
            x: p1.x + (p2.x - p1.x) * t, 
            y: p1.y + (p2.y - p1.y) * t 
        };
        this.simData.laserOn = p2.laserOn;
        this.simData.progress = (this.simCurrentIndex / (pts.length - 1)) * 100;
        
        document.getElementById('simPos').textContent = `${this.simData.currentPoint.x.toFixed(1)}, ${this.simData.currentPoint.y.toFixed(1)}`;
        document.getElementById('simProgress').textContent = `${this.simData.progress.toFixed(0)}%`;
        document.getElementById('simProgressBar').style.width = `${this.simData.progress}%`;
        document.getElementById('simTime').textContent = this.formatTime((Date.now() - this.simStartTime) / 1000);
        
        this.simCurrentIndex += 0.2 * this.simSpeed;
        this.render();
        this.simAnimationId = requestAnimationFrame(() => this.animateSimulation());
    }

    stopSimulation() {
        this.simulating = false;
        if (this.simAnimationId) cancelAnimationFrame(this.simAnimationId);
        document.getElementById('simOverlay').classList.remove('show');
        this.simData = null;
        this.render();
        this.log('⏹️ Simulation stopped');
    }

    toggleSimPause() {
        if (!this.simulating) return;
        this.simPaused = !this.simPaused;
        document.getElementById('btnSimPause').textContent = this.simPaused ? '▶' : '⏸';
    }

    formatTime(sec) { 
        return `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`; 
    }

    // ========== FILE LOADING - CENTRATO ==========
    
    loadFile(file) {
        if (!file) return;
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const maxSize = Math.min(this.workArea.w, this.workArea.h) * 0.4;
                    let w = img.width / 10, h = img.height / 10;
                    if (w > maxSize || h > maxSize) { const s = maxSize / Math.max(w, h); w *= s; h *= s; }
                    
                    // ⭐ Centrato a 0,0
                    const obj = new LaserObject('image', {
                        name: file.name.replace(/\.[^.]+$/, ''), 
                        image: img, 
                        w, 
                        h,
                        x: -w / 2,
                        y: -h / 2
                    });
                    this.objects.push(obj);
                    this.objects.forEach(o => o.selected = false);
                    obj.selected = true;
                    this.selected = obj;
                    this.updateProps();
                    this.render();
                    this.updateObjList();
                    this.log('📁 Loaded: ' + file.name);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else if (file.name.endsWith('.svg')) {
            const reader = new FileReader();
            reader.onload = e => {
                const svg = new DOMParser().parseFromString(e.target.result, 'image/svg+xml');
                const paths = [];
                
                svg.querySelectorAll('path').forEach(el => {
                    const d = el.getAttribute('d');
                    if (d) { const pts = this.parseSVGPath(d); if (pts.length > 1) paths.push(pts); }
                });
                
                svg.querySelectorAll('rect').forEach(el => {
                    const x = parseFloat(el.getAttribute('x')) || 0;
                    const y = parseFloat(el.getAttribute('y')) || 0;
                    const w = parseFloat(el.getAttribute('width')) || 0;
                    const h = parseFloat(el.getAttribute('height')) || 0;
                    if (w && h) paths.push([{x,y}, {x:x+w,y}, {x:x+w,y:y+h}, {x,y:y+h}, {x,y}]);
                });
                
                svg.querySelectorAll('line').forEach(el => {
                    const x1 = parseFloat(el.getAttribute('x1')) || 0;
                    const y1 = parseFloat(el.getAttribute('y1')) || 0;
                    const x2 = parseFloat(el.getAttribute('x2')) || 0;
                    const y2 = parseFloat(el.getAttribute('y2')) || 0;
                    paths.push([{x:x1,y:y1}, {x:x2,y:y2}]);
                });
                
                svg.querySelectorAll('polyline, polygon').forEach(el => {
                    const points = el.getAttribute('points');
                    if (points) {
                        const pts = points.trim().split(/[\s,]+/).map(parseFloat);
                        const path = [];
                        for (let i = 0; i < pts.length; i += 2) {
                            if (!isNaN(pts[i]) && !isNaN(pts[i+1])) path.push({x: pts[i], y: pts[i+1]});
                        }
                        if (el.tagName === 'polygon' && path.length > 0) path.push({x: path[0].x, y: path[0].y});
                        if (path.length > 1) paths.push(path);
                    }
                });
                
                svg.querySelectorAll('circle').forEach(el => {
                    const cx = parseFloat(el.getAttribute('cx')) || 0;
                    const cy = parseFloat(el.getAttribute('cy')) || 0;
                    const r = parseFloat(el.getAttribute('r')) || 0;
                    if (r > 0) {
                        const path = [];
                        for (let a = 0; a <= 360; a += 10) {
                            const rad = a * Math.PI / 180;
                            path.push({x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad)});
                        }
                        paths.push(path);
                    }
                });
                
                svg.querySelectorAll('ellipse').forEach(el => {
                    const cx = parseFloat(el.getAttribute('cx')) || 0;
                    const cy = parseFloat(el.getAttribute('cy')) || 0;
                    const rx = parseFloat(el.getAttribute('rx')) || 0;
                    const ry = parseFloat(el.getAttribute('ry')) || 0;
                    if (rx > 0 && ry > 0) {
                        const path = [];
                        for (let a = 0; a <= 360; a += 10) {
                            const rad = a * Math.PI / 180;
                            path.push({x: cx + rx * Math.cos(rad), y: cy + ry * Math.sin(rad)});
                        }
                        paths.push(path);
                    }
                });
                
                if (paths.length) {
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    paths.forEach(p => p.forEach(pt => { minX = Math.min(minX, pt.x); minY = Math.min(minY, pt.y); maxX = Math.max(maxX, pt.x); maxY = Math.max(maxY, pt.y); }));
                    const w = maxX - minX || 1, h = maxY - minY || 1;
                    const norm = paths.map(p => p.map(pt => ({ x: (pt.x - minX) / w, y: (pt.y - minY) / h })));
                    
                    // ⭐ Centrato a 0,0
                    const obj = new LaserObject('vector', { 
                        name: file.name.replace(/\.[^.]+$/, ''), 
                        paths: norm, 
                        w: w/10, 
                        h: h/10, 
                        x: -(w/10) / 2, 
                        y: -(h/10) / 2 
                    });
                    this.objects.push(obj);
                    obj.selected = true; this.selected = obj;
                    this.updateProps(); this.render(); this.updateObjList();
                    this.log(`📁 Loaded SVG (${paths.length} paths)`);
                } else {
                    this.log('⚠️ No paths found in SVG', 'err');
                }
            };
            reader.readAsText(file);
        }
    }

    parseSVGPath(d) {
        const pts = [];
        const cmds = d.match(/[MLHVCSQTAZmlhvcsqtaz][^MLHVCSQTAZmlhvcsqtaz]*/gi) || [];
        let cx = 0, cy = 0, sx = 0, sy = 0;
        
        cmds.forEach(cmd => {
            const type = cmd[0];
            const args = cmd.slice(1).trim().split(/[\s,]+/).map(parseFloat).filter(n => !isNaN(n));
            
            switch(type) {
                case 'M': cx = args[0]; cy = args[1]; sx = cx; sy = cy; pts.push({x:cx,y:cy}); 
                    for (let i = 2; i < args.length; i += 2) { cx = args[i]; cy = args[i+1]; pts.push({x:cx,y:cy}); }
                    break;
                case 'm': cx += args[0]; cy += args[1]; sx = cx; sy = cy; pts.push({x:cx,y:cy});
                    for (let i = 2; i < args.length; i += 2) { cx += args[i]; cy += args[i+1]; pts.push({x:cx,y:cy}); }
                    break;
                case 'L': for (let i = 0; i < args.length; i += 2) { cx = args[i]; cy = args[i+1]; pts.push({x:cx,y:cy}); } break;
                case 'l': for (let i = 0; i < args.length; i += 2) { cx += args[i]; cy += args[i+1]; pts.push({x:cx,y:cy}); } break;
                case 'H': cx = args[0]; pts.push({x:cx,y:cy}); break;
                case 'h': cx += args[0]; pts.push({x:cx,y:cy}); break;
                case 'V': cy = args[0]; pts.push({x:cx,y:cy}); break;
                case 'v': cy += args[0]; pts.push({x:cx,y:cy}); break;
                case 'C':
                    for (let i = 0; i < args.length; i += 6) {
                        const x1 = args[i], y1 = args[i+1], x2 = args[i+2], y2 = args[i+3], x = args[i+4], y = args[i+5];
                        for (let t = 0.1; t <= 1; t += 0.1) {
                            const px = Math.pow(1-t,3)*cx + 3*Math.pow(1-t,2)*t*x1 + 3*(1-t)*t*t*x2 + Math.pow(t,3)*x;
                            const py = Math.pow(1-t,3)*cy + 3*Math.pow(1-t,2)*t*y1 + 3*(1-t)*t*t*y2 + Math.pow(t,3)*y;
                            pts.push({x:px,y:py});
                        }
                        cx = x; cy = y;
                    }
                    break;
                case 'c':
                    for (let i = 0; i < args.length; i += 6) {
                        const x1 = cx+args[i], y1 = cy+args[i+1], x2 = cx+args[i+2], y2 = cy+args[i+3], x = cx+args[i+4], y = cy+args[i+5];
                        for (let t = 0.1; t <= 1; t += 0.1) {
                            const px = Math.pow(1-t,3)*cx + 3*Math.pow(1-t,2)*t*x1 + 3*(1-t)*t*t*x2 + Math.pow(t,3)*x;
                            const py = Math.pow(1-t,3)*cy + 3*Math.pow(1-t,2)*t*y1 + 3*(1-t)*t*t*y2 + Math.pow(t,3)*y;
                            pts.push({x:px,y:py});
                        }
                        cx = x; cy = y;
                    }
                    break;
                case 'Q':
                    for (let i = 0; i < args.length; i += 4) {
                        const x1 = args[i], y1 = args[i+1], x = args[i+2], y = args[i+3];
                        for (let t = 0.1; t <= 1; t += 0.1) {
                            const px = Math.pow(1-t,2)*cx + 2*(1-t)*t*x1 + t*t*x;
                            const py = Math.pow(1-t,2)*cy + 2*(1-t)*t*y1 + t*t*y;
                            pts.push({x:px,y:py});
                        }
                        cx = x; cy = y;
                    }
                    break;
                case 'q':
                    for (let i = 0; i < args.length; i += 4) {
                        const x1 = cx+args[i], y1 = cy+args[i+1], x = cx+args[i+2], y = cy+args[i+3];
                        for (let t = 0.1; t <= 1; t += 0.1) {
                            const px = Math.pow(1-t,2)*cx + 2*(1-t)*t*x1 + t*t*x;
                            const py = Math.pow(1-t,2)*cy + 2*(1-t)*t*y1 + t*t*y;
                            pts.push({x:px,y:py});
                        }
                        cx = x; cy = y;
                    }
                    break;
                case 'A': case 'a':
                    if (args.length >= 7) {
                        const endX = type === 'A' ? args[5] : cx + args[5];
                        const endY = type === 'A' ? args[6] : cy + args[6];
                        pts.push({x:endX, y:endY});
                        cx = endX; cy = endY;
                    }
                    break;
                case 'Z': case 'z': pts.push({x:sx,y:sy}); cx = sx; cy = sy; break;
            }
        });
        return pts;
    }

    // ========== TEXT CREATION - CENTRATO ==========
    
    createText() {
        const text = document.getElementById('textContent').value.trim();
        if (!text) return;
        const font = document.getElementById('textFont').value;
        const size = +document.getElementById('textSize').value;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = `${size * 10}px ${font}`;
        const maxW = Math.max(...text.split('\n').map(l => ctx.measureText(l).width)) / 10;
        const h = size * text.split('\n').length * 1.2;
        canvas.width = Math.ceil(maxW * 10) + 20;
        canvas.height = Math.ceil(h * 10) + 20;
        ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'black'; ctx.font = `${size * 10}px ${font}`; ctx.textBaseline = 'top';
        text.split('\n').forEach((line, i) => ctx.fillText(line, 10, 10 + i * size * 10 * 1.2));
        const img = new Image();
        img.onload = () => {
            // ⭐ Centrato a 0,0
            const obj = new LaserObject('text', { 
                name: 'Text_' + text.substring(0,8), 
                image: img, 
                w: maxW, 
                h, 
                x: -maxW/2, 
                y: -h/2 
            });
            this.objects.push(obj);
            this.objects.forEach(o => o.selected = false);
            obj.selected = true; this.selected = obj;
            this.updateProps(); this.render(); this.updateObjList();
            closeModal('modalText');
            document.getElementById('textContent').value = '';
            this.log('📝 Text added');
        };
        img.src = canvas.toDataURL();
    }

    createVectorText() {
        const text = document.getElementById('vectorTextContent').value.trim().toUpperCase();
        if (!text) return;
        
        const fontSize = +document.getElementById('vectorTextSize').value;
        const bold = document.getElementById('vectorTextBold').checked;
        
        const paths = [];
        const charWidth = 0.7;
        const charSpacing = 0.15;
        let cursorX = 0;
        
        for (const char of text) {
            const charPaths = this.vectorFonts[char] || this.vectorFonts['?'];
            if (charPaths) {
                charPaths.forEach(path => {
                    const translatedPath = path.map(p => ({
                        x: (p.x * charWidth + cursorX) / (text.length * (charWidth + charSpacing)),
                        y: p.y
                    }));
                    paths.push(translatedPath);
                    
                    if (bold) {
                        const boldPath = path.map(p => ({
                            x: (p.x * charWidth + cursorX + 0.03) / (text.length * (charWidth + charSpacing)),
                            y: p.y + 0.02
                        }));
                        paths.push(boldPath);
                    }
                });
            }
            cursorX += charWidth + charSpacing;
        }
        
        if (paths.length === 0) {
            this.log('⚠️ No characters to create', 'err');
            return;
        }
        
        const totalWidth = fontSize * text.length * 0.7;
        const totalHeight = fontSize * 1.2;
        
        // ⭐ Centrato a 0,0
        const obj = new LaserObject('vectorText', {
            name: 'VecTxt_' + text.substring(0, 6),
            paths: paths,
            w: totalWidth,
            h: totalHeight,
            x: -totalWidth / 2,
            y: -totalHeight / 2
        });
        
        this.objects.push(obj);
        this.objects.forEach(o => o.selected = false);
        obj.selected = true;
        this.selected = obj;
        this.updateProps();
        this.render();
        this.updateObjList();
        closeModal('modalVectorText');
        document.getElementById('vectorTextContent').value = '';
        this.log('🔤 Vector text added: ' + text);
    }

    // ========== VECTORIZATION ==========
    
    async vectorize() {
        if (!this.selected?.image) { this.log('⚠️ Select an image first', 'err'); return; }
        document.getElementById('loading').classList.add('show');
        document.getElementById('loadingText').textContent = 'Vectorizing...';
        await this.delay(50);
        try {
            const img = this.selected.image;
            const threshold = +document.getElementById('vecTreshold').value;
            const margin = +document.getElementById('borderMargin').value;
            const removeBorders = document.getElementById('removeBorders').checked;
            
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                const g = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                d[i] = d[i+1] = d[i+2] = g < threshold ? 0 : 255;
                d[i+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
            
            const opts = ImageTracer.optionpresets.default;
            opts.pathomit = 8;
            const trace = ImageTracer.imagedataToTracedata(imgData, opts);
            
            let paths = [];
            trace.layers.forEach(layer => layer.forEach(pathObj => {
                if (pathObj.segments?.length > 2) {
                    const p = [];
                    pathObj.segments.forEach(s => {
                        if (s.type === 'L' || s.type === 'M') p.push({x: s.x1, y: s.y1});
                        else if (s.type === 'Q') {
                            for (let t = 0; t <= 1; t += 0.25) {
                                p.push({ x: (1-t)**2*s.x1 + 2*(1-t)*t*s.x2 + t*t*s.x3, y: (1-t)**2*s.y1 + 2*(1-t)*t*s.y2 + t*t*s.y3 });
                            }
                        }
                    });
                    if (p.length > 3) { p.push({x: p[0].x, y: p[0].y}); paths.push(p); }
                }
            }));
            
            if (removeBorders && margin > 0) {
                paths = paths.filter(p => {
                    let tL=0, tR=0, tT=0, tB=0;
                    p.forEach(pt => { if (pt.x <= margin) tL++; if (pt.x >= canvas.width - margin) tR++; if (pt.y <= margin) tT++; if (pt.y >= canvas.height - margin) tB++; });
                    const ratio = (tL + tR + tT + tB) / p.length;
                    return !(tL && tR && tT && tB && ratio > 0.4) && ratio < 0.7;
                });
            }
            
            paths = paths.filter(p => this.pathLength(p) > 10);
            
            if (!paths.length) { this.log('⚠️ No contours found', 'err'); document.getElementById('loading').classList.remove('show'); return; }
            
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            paths.forEach(p => p.forEach(pt => { minX = Math.min(minX, pt.x); minY = Math.min(minY, pt.y); maxX = Math.max(maxX, pt.x); maxY = Math.max(maxY, pt.y); }));
            const w = maxX - minX || 1, h = maxY - minY || 1;
            const norm = paths.map(p => p.map(pt => ({ x: (pt.x - minX) / w, y: (pt.y - minY) / h })));
            
            const vecObj = new LaserObject('vector', { 
                name: this.selected.name + '_vec', 
                paths: norm, 
                x: this.selected.x, 
                y: this.selected.y, 
                w: this.selected.w, 
                h: this.selected.h, 
                rotation: this.selected.rotation,
                flipH: this.selected.flipH,
                flipV: this.selected.flipV,
                power: this.selected.power, 
                speed: this.selected.speed, 
                passes: this.selected.passes 
            });
            this.objects.push(vecObj);
            this.objects.forEach(o => o.selected = false);
            vecObj.selected = true; this.selected = vecObj;
            this.updateProps(); this.render(); this.updateObjList();
            this.log(`✅ Vectorized (${paths.length} paths)`);
        } catch (err) { this.log('❌ Error: ' + err.message, 'err'); }
        document.getElementById('loading').classList.remove('show');
    }

    // ========== MACHINE SETTINGS ==========
    
    loadMachine() { 
        try { 
            const saved = JSON.parse(localStorage.getItem('laserMachine'));
            if (saved) return saved;
        } catch {} 
        return { maxX: 300, maxY: 300, mirrorX: false, mirrorY: true }; 
    }
    
    saveMachine() {
        this.machine = { 
            maxX: +document.getElementById('machX').value, 
            maxY: +document.getElementById('machY').value,
            mirrorX: document.getElementById('mirrorX').checked,
            mirrorY: document.getElementById('mirrorY').checked
        };
        localStorage.setItem('laserMachine', JSON.stringify(this.machine));
        this.applyMachineProfile();
        this.log('💾 Machine profile saved');
    }
    
    applyMachineProfile() {
        document.getElementById('machX').value = this.machine.maxX;
        document.getElementById('machY').value = this.machine.maxY;
        document.getElementById('mirrorX').checked = this.machine.mirrorX || false;
        document.getElementById('mirrorY').checked = this.machine.mirrorY !== undefined ? this.machine.mirrorY : true;
        this.workArea = { w: this.machine.maxX, h: this.machine.maxY };
        this.render();
    }

    // ========== PRESETS ==========
    
    loadPresets() { 
        try { 
            return JSON.parse(localStorage.getItem('laserPresets')) || this.defaultPresets(); 
        } catch { 
            return this.defaultPresets(); 
        } 
    }
    
    defaultPresets() { 
        return { 
            wood: { name: 'Wood', power: 70, speed: 1500 }, 
            acrylic: { name: 'Acrylic', power: 100, speed: 400 }, 
            paper: { name: 'Paper', power: 25, speed: 3000 },
            leather: { name: 'Leather', power: 50, speed: 800 },
            cardboard: { name: 'Cardboard', power: 40, speed: 1200 }
        }; 
    }
    
    renderPresets() {
        document.getElementById('presetGrid').innerHTML = Object.entries(this.presets).map(([id, p]) => `
            <div class="preset-item" onclick="app.applyPreset('${id}')">
                <strong>${p.name}</strong><br><small>${p.power}% / ${p.speed}</small>
                <button class="preset-del" onclick="event.stopPropagation(); app.deletePreset('${id}')">×</button>
            </div>
        `).join('');
    }
    
    applyPreset(id) {
        const p = this.presets[id];
        if (!p) return;
        (this.selected ? [this.selected] : this.objects).forEach(o => { 
            o.power = p.power; 
            o.speed = p.speed; 
        });
        if (this.selected) this.updateProps();
        this.log('✅ Applied preset: ' + p.name);
    }
    
    savePreset() {
        const name = document.getElementById('presetName').value.trim();
        if (!name) return;
        this.presets['custom_' + Date.now()] = { 
            name, 
            power: +document.getElementById('presetPwr').value, 
            speed: +document.getElementById('presetSpd').value 
        };
        localStorage.setItem('laserPresets', JSON.stringify(this.presets));
        this.renderPresets();
        closeModal('modalPreset');
        document.getElementById('presetName').value = '';
        this.log('💾 Preset saved');
    }
    
    deletePreset(id) { 
        if (this.presets[id]) { 
            delete this.presets[id]; 
            localStorage.setItem('laserPresets', JSON.stringify(this.presets)); 
            this.renderPresets(); 
        } 
    }

    // ========== PROJECT SAVE/LOAD ==========
    
    saveProject() {
        const project = { 
            version: '1.0-relative',
            workArea: this.workArea, 
            machine: this.machine,
            objects: this.objects.map(obj => {
                const d = { ...obj }; 
                delete d.selected; 
                delete d.selectedPathIndex;
                if (obj.image) { 
                    const c = document.createElement('canvas'); 
                    c.width = obj.image.width; 
                    c.height = obj.image.height; 
                    c.getContext('2d').drawImage(obj.image, 0, 0); 
                    d.imageData = c.toDataURL(); 
                    delete d.image; 
                }
                return d;
            }) 
        };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' }));
        a.download = 'project_relative_' + Date.now() + '.lcp';
        a.click();
        this.log('💾 Project saved');
    }

    loadProject(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const proj = JSON.parse(e.target.result);
                this.objects = []; 
                this.selected = null;
                
                if (proj.workArea) { 
                    this.workArea = proj.workArea; 
                    this.machine = { 
                        maxX: proj.workArea.w, 
                        maxY: proj.workArea.h,
                        mirrorX: proj.machine?.mirrorX || false,
                        mirrorY: proj.machine?.mirrorY !== undefined ? proj.machine.mirrorY : true
                    }; 
                    this.applyMachineProfile(); 
                }
                
                let loadedImages = 0;
                const totalImages = proj.objects?.filter(d => d.imageData).length || 0;
                
                proj.objects?.forEach(data => {
                    const obj = new LaserObject(data.type, data);
                    Object.assign(obj, data);
                    obj.selected = false;
                    obj.selectedPathIndex = -1;
                    
                    if (data.imageData) { 
                        const img = new Image(); 
                        img.onload = () => { 
                            obj.image = img; 
                            delete obj.imageData; 
                            loadedImages++;
                            if (loadedImages >= totalImages) this.render(); 
                        }; 
                        img.src = data.imageData; 
                    }
                    this.objects.push(obj);
                });
                
                this.render(); 
                this.updateObjList();
                this.log(`📁 Project loaded (${proj.objects?.length || 0} objects)`);
            } catch (err) { 
                this.log('❌ Error: ' + err.message, 'err'); 
            }
        };
        reader.readAsText(file);
    }

    // ========== UTILITIES ==========
    
    log(msg, type = 'info') {
        const log = document.getElementById('consoleLog');
        const line = document.createElement('div');
        line.className = 'console-line ' + type;
        line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
        document.getElementById('footStatus').textContent = msg;
        
        while (log.children.length > 500) {
            log.removeChild(log.firstChild);
        }
    }

    delay(ms) { 
        return new Promise(r => setTimeout(r, ms)); 
    }
}

// ========== MODAL FUNCTIONS ==========
function openModal(id) { 
    document.getElementById(id).classList.add('show'); 
}

function closeModal(id) { 
    document.getElementById(id).classList.remove('show'); 
}

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', e => {
    if (!app) return;
    
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    
    if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        app.deleteSelected();
    } else if (e.key === 'Escape') {
        if (app.editMode) app.exitEditMode();
        closeModal('modalPreset');
        closeModal('modalText');
        closeModal('modalVectorText');
        closeModal('modalGcode');
    } else if (e.ctrlKey || e.metaKey) {
        if (e.key === 'd' || e.key === 'D') {
            e.preventDefault();
            app.duplicateSelected();
        } else if (e.key === 'a' || e.key === 'A') {
            e.preventDefault();
            app.selectAll();
        } else if (e.key === 's' || e.key === 'S') {
            e.preventDefault();
            app.saveProject();
        }
    } else if (e.key === 'r' || e.key === 'R') {
        app.rotateSelected(e.shiftKey ? -90 : 90);
    } else if (e.key === 'h' || e.key === 'H') {
        app.flipSelected('h');
    } else if (e.key === 'v' || e.key === 'V') {
        app.flipSelected('v');
    }
});
