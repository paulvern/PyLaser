<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaserCAM Pro 1.0 - Relative Mode</title>
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script>
<style>
:root {
    --bg: #0a0e1a; --panel: #151b2e; --input: #1e2740; --accent: #00d4ff;
    --danger: #ff4757; --success: #2ed573; --warn: #ffa502;
    --text: #e4e9f0; --dim: #6c7a89; --border: #2a3650;
    --laser: #ff3333; --ruler: #1a2530;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
.app { display: grid; grid-template: 50px 1fr 35px / 260px 1fr 280px; height: 100vh; gap: 1px; background: var(--border); }

header { grid-column: 1/-1; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 2px solid var(--accent); }
.logo { font-weight: 700; font-size: 18px; }
.hdr-ctrl { display: flex; gap: 8px; align-items: center; }
.status { width: 10px; height: 10px; border-radius: 50%; background: #555; }
.status.on { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.lang-selector { display: flex; gap: 2px; background: var(--input); border-radius: 4px; padding: 2px; }
.lang-btn { padding: 3px 6px; border: none; background: transparent; color: var(--dim); cursor: pointer; border-radius: 3px; font-size: 10px; }
.lang-btn.active { background: var(--accent); color: #000; }

aside { background: var(--panel); overflow-y: auto; }
.sec { padding: 10px; border-bottom: 1px solid var(--border); }
.sec-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; font-weight: 600; }
.form-g { margin-bottom: 6px; }
.form-g label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
input, select, textarea { width: 100%; background: var(--input); border: 1px solid var(--border); color: var(--text); padding: 5px 7px; border-radius: 3px; font-size: 12px; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
input[type="range"] { accent-color: var(--accent); padding: 0; }
input[type="checkbox"] { width: auto; }
.row { display: flex; gap: 5px; }
.row > * { flex: 1; }

.btn { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 500; transition: all 0.2s; background: var(--border); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-p { background: var(--accent); color: #000; }
.btn-d { background: var(--danger); color: #fff; }
.btn-s { background: var(--success); color: #000; }
.btn-w { background: var(--warn); color: #000; }
.btn-sm { padding: 4px 7px; font-size: 10px; }
.btn-block { width: 100%; }

main { position: relative; background: #000; overflow: hidden; }
canvas { position: absolute; top: 0; left: 0; }
.toolbar { position: absolute; top: 10px; left: 40px; background: rgba(0,0,0,0.9); padding: 6px; border-radius: 6px; display: flex; gap: 4px; backdrop-filter: blur(10px); flex-wrap: wrap; max-width: 500px; z-index: 10; border: 1px solid var(--border); }
.canvas-info { position: absolute; bottom: 10px; left: 40px; background: rgba(0,0,0,0.8); padding: 6px 10px; border-radius: 6px; font-size: 11px; backdrop-filter: blur(10px); z-index: 10; }

.edit-mode-bar { position: absolute; top: 55px; left: 40px; background: var(--warn); color: #000; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; display: none; z-index: 20; }
.edit-mode-bar.show { display: flex; align-items: center; gap: 8px; }

.context-menu { position: fixed; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 4px 0; min-width: 180px; z-index: 2000; box-shadow: 0 5px 20px rgba(0,0,0,0.5); display: none; }
.context-menu.show { display: block; }
.context-menu-item { padding: 7px 12px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 6px; transition: 0.15s; }
.context-menu-item:hover { background: var(--accent); color: #000; }
.context-menu-item.disabled { opacity: 0.4; pointer-events: none; }
.context-menu-separator { height: 1px; background: var(--border); margin: 4px 0; }

.path-list { max-height: 150px; overflow-y: auto; margin-top: 6px; }
.path-item { padding: 5px 8px; border: 1px solid var(--border); border-radius: 3px; margin-bottom: 3px; cursor: pointer; font-size: 10px; display: flex; justify-content: space-between; align-items: center; }
.path-item:hover { border-color: var(--accent); }
.path-item.selected { background: rgba(0, 212, 255, 0.2); border-color: var(--accent); }
.path-item .path-color { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.path-item .path-del { background: var(--danger); border: none; color: #fff; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 9px; }

.sim-overlay { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.95); padding: 12px; border-radius: 8px; backdrop-filter: blur(10px); border: 2px solid var(--laser); display: none; min-width: 180px; z-index: 100; }
.sim-overlay.show { display: block; }
.sim-overlay h4 { color: var(--laser); margin-bottom: 8px; font-size: 12px; }
.sim-info { font-size: 11px; }
.sim-info div { margin: 4px 0; }
.sim-progress { height: 5px; background: var(--input); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.sim-progress-bar { height: 100%; background: var(--laser); width: 0%; transition: width 0.1s; }

.obj-list { max-height: 180px; overflow-y: auto; }
.obj-item { padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
.obj-item:hover { background: var(--input); }
.obj-item.sel { background: rgba(0, 212, 255, 0.15); border-left: 3px solid var(--accent); }
.obj-del { background: var(--danger); border: none; color: #fff; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 9px; }

footer { grid-column: 1/-1; background: var(--panel); display: flex; align-items: center; padding: 0 15px; gap: 15px; font-size: 11px; border-top: 1px solid var(--border); }
.progress { flex: 1; height: 5px; background: var(--input); border-radius: 3px; overflow: hidden; max-width: 250px; }
.progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
.modal.show { display: flex; }
.modal-content { background: var(--panel); border-radius: 8px; padding: 15px; width: 90%; max-width: 450px; border: 1px solid var(--accent); max-height: 90vh; overflow-y: auto; }
.modal-content.wide { max-width: 750px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-header h3 { font-size: 14px; }
.modal-close { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }

.preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.preset-item { padding: 8px; background: var(--input); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; text-align: center; font-size: 10px; position: relative; }
.preset-item:hover { border-color: var(--accent); }
.preset-del { position: absolute; top: 2px; right: 2px; background: var(--danger); border: none; color: #fff; width: 14px; height: 14px; border-radius: 50%; font-size: 9px; cursor: pointer; display: none; }
.preset-item:hover .preset-del { display: block; }

.console { position: fixed; bottom: 35px; left: 0; right: 0; height: 180px; background: var(--panel); border-top: 2px solid var(--accent); display: none; flex-direction: column; z-index: 100; }
.console.show { display: flex; }
.console-log { flex: 1; overflow-y: auto; padding: 8px; font-family: 'Courier New', monospace; font-size: 10px; }
.console-line { padding: 1px 0; }
.console-line.send { color: var(--success); }
.console-line.recv { color: #64b5f6; }
.console-line.err { color: var(--danger); }
.console-line.warn { color: var(--warn); }
.console-input { display: flex; gap: 4px; padding: 6px; background: var(--input); }

.loading { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; gap: 12px; }
.loading.show { display: flex; }
.spinner { width: 35px; height: 35px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#gcodeOutput { width: 100%; height: 280px; font-family: 'Courier New', monospace; font-size: 10px; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 8px; resize: vertical; }

.tab-buttons { display: flex; gap: 2px; margin-bottom: 8px; }
.tab-btn { flex: 1; padding: 6px; border: none; background: var(--input); color: var(--dim); cursor: pointer; font-size: 10px; }
.tab-btn:first-child { border-radius: 4px 0 0 4px; }
.tab-btn:last-child { border-radius: 0 4px 4px 0; }
.tab-btn.active { background: var(--accent); color: #000; font-weight: bold; }

.transform-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 6px; }

.home-pos-display { 
    background: var(--input); 
    padding: 6px 8px; 
    border-radius: 4px; 
    font-size: 10px; 
    margin-top: 6px;
    border: 1px solid var(--success);
}
.home-pos-display strong { color: var(--success); }

/* ⭐ Badge modalità relativa */
.relative-mode-badge {
    background: var(--warn);
    color: #000;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: bold;
    margin-left: 8px;
}
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="logo">
            ⚡ LaserCAM Pro v1.0
            <span class="relative-mode-badge">RELATIVE MODE</span>
        </div>
        <div class="hdr-ctrl">
            <div class="lang-selector" id="langSelector"></div>
            <span class="status" id="status"></span>
            <span id="statusTxt"></span>
            <select id="baudRate" style="width:80px"><option>115200</option><option>250000</option><option>9600</option></select>
            <button class="btn btn-p" id="btnConn"></button>
            <button class="btn btn-d" id="btnStop"></button>
        </div>
    </header>

    <aside id="leftPanel">
        <div class="sec">
            <div class="sec-title" data-i18n="sec_project"></div>
            <div class="row">
                <button class="btn btn-sm" id="btnSaveProj" data-i18n="btn_save"></button>
                <button class="btn btn-sm" id="btnLoadProj" data-i18n="btn_load"></button>
            </div>
        </div>

        <div class="sec">
            <div class="sec-title" data-i18n="sec_machine"></div>
            <div class="row">
                <div class="form-g"><label data-i18n="lbl_x_max"></label><input type="number" id="machX" value="300"></div>
                <div class="form-g"><label data-i18n="lbl_y_max"></label><input type="number" id="machY" value="300"></div>
            </div>
            <div class="form-g">
                <label><input type="checkbox" id="mirrorX"> <span data-i18n="lbl_mirror_x"></span></label>
            </div>
            <div class="form-g">
                <label><input type="checkbox" id="mirrorY" checked> <span data-i18n="lbl_mirror_y"></span></label>
            </div>
            <button class="btn btn-p btn-sm btn-block" id="btnSaveMach" data-i18n="btn_save_profile"></button>
        </div>

        <div class="sec">
            <div class="sec-title">🎯 HOME (Center 0,0)</div>
            <div class="home-pos-display" id="currentPosDisplay">
                <div><strong>Current:</strong> <span id="currentPosText">X0.000 Y0.000</span></div>
            </div>
            <p style="font-size:9px; color:var(--dim); margin-top:5px">
                Move laser manually to desired center position, then click "Set Home"
            </p>
            <div class="row" style="margin-top:6px">
                <button class="btn btn-s btn-sm btn-block" id="btnSetHomeCurrent">📍 Set Home (G92)</button>
            </div>
            <div class="row" style="margin-top:4px">
                <button class="btn btn-sm" id="btnGoHome" data-i18n="btn_go"></button>
            </div>
        </div>

        <div class="sec">
            <div class="sec-title" data-i18n="sec_import"></div>
            <input type="file" id="fileInput" accept="image/*,.svg" style="display:none">
            <button class="btn btn-p btn-block btn-sm" onclick="fileInput.click()" data-i18n="btn_import_image"></button>
            <button class="btn btn-block btn-sm" id="btnAddText" style="margin-top:4px" data-i18n="btn_add_text"></button>
            <button class="btn btn-block btn-sm" id="btnAddVectorText" style="margin-top:4px" data-i18n="btn_add_vector_text"></button>
        </div>

        <div class="sec" id="vecSection" style="display:none">
            <div class="sec-title" data-i18n="sec_vectorize"></div>
            <div class="form-g">
                <label><span data-i18n="lbl_threshold"></span>: <span id="treshVal">128</span></label>
                <input type="range" id="vecTreshold" min="1" max="255" value="128">
            </div>
            <div class="form-g">
                <label><span data-i18n="lbl_border_margin"></span>: <span id="borderMarginVal">15</span>px</label>
                <input type="range" id="borderMargin" min="0" max="50" value="15">
            </div>
            <div class="form-g">
                <label><input type="checkbox" id="removeBorders" checked> <span data-i18n="lbl_remove_borders"></span></label>
            </div>
            <button class="btn btn-s btn-block btn-sm" id="btnVectorize" data-i18n="btn_vectorize"></button>
        </div>

        <div class="sec" id="rasterSection" style="display:none">
            <div class="sec-title" data-i18n="sec_raster"></div>
            <div class="form-g">
                <label><span data-i18n="lbl_resolution"></span>: <span id="rasterResVal">10</span> l/mm</label>
                <input type="range" id="rasterRes" min="2" max="20" value="10">
            </div>
            <div class="form-g">
                <label><input type="checkbox" id="rasterBidir" checked> <span data-i18n="lbl_bidirectional"></span></label>
            </div>
            <button class="btn btn-w btn-block btn-sm" id="btnRasterGcode" data-i18n="btn_raster_gcode"></button>
        </div>

        <div class="sec" id="pathEditSection" style="display:none">
            <div class="sec-title" data-i18n="sec_path_editor"></div>
            <div class="path-list" id="pathList"></div>
            <div class="row" style="margin-top:6px">
                <button class="btn btn-sm btn-d" id="btnDeletePath" data-i18n="btn_delete"></button>
                <button class="btn btn-sm" id="btnDeleteAllSmall" data-i18n="btn_delete_small"></button>
            </div>
        </div>

        <div class="sec">
            <div class="sec-title" data-i18n="sec_presets"></div>
            <div class="preset-grid" id="presetGrid"></div>
            <button class="btn btn-sm btn-block" style="margin-top:6px" id="btnAddPreset" data-i18n="btn_new_preset"></button>
        </div>
    </aside>

    <main id="canvasParent">
        <div class="toolbar">
            <button class="btn btn-sm" id="btnFit" data-i18n-title="tip_fit">📐</button>
            <button class="btn btn-sm" id="btnDel" data-i18n-title="tip_delete">🗑️</button>
            <button class="btn btn-sm" id="btnDup" data-i18n-title="tip_duplicate">📋</button>
            <button class="btn btn-sm" id="btnRotateCW" data-i18n-title="tip_rotate_cw">↻</button>
            <button class="btn btn-sm" id="btnRotateCCW" data-i18n-title="tip_rotate_ccw">↺</button>
            <button class="btn btn-sm" id="btnFlipH" data-i18n-title="tip_flip_h">⇄</button>
            <button class="btn btn-sm" id="btnFlipV" data-i18n-title="tip_flip_v">⇅</button>
            <button class="btn btn-sm" id="btnGcode" data-i18n-title="tip_gcode">📄</button>
            <button class="btn btn-sm btn-w" id="btnSimulate" data-i18n-title="tip_simulate">🎬</button>
            <button class="btn btn-sm" id="btnFrameJob" data-i18n-title="tip_frame">🔲</button>
            <button class="btn btn-sm" id="btnEditPaths" data-i18n-title="tip_edit_paths">✂️</button>
        </div>
        
        <div class="edit-mode-bar" id="editModeBar">
            <span data-i18n="edit_mode_label"></span>
            <button class="btn btn-sm" id="btnExitEdit" data-i18n="btn_exit"></button>
        </div>
        
        <div class="sim-overlay" id="simOverlay">
            <h4 data-i18n="sim_title"></h4>
            <div class="sim-info">
                <div><span data-i18n="sim_pos"></span>: <strong id="simPos">0, 0</strong></div>
                <div><span data-i18n="sim_progress"></span>: <strong id="simProgress">0%</strong></div>
                <div><span data-i18n="sim_time"></span>: <strong id="simTime">0:00</strong></div>
                <div><span data-i18n="sim_mode"></span>: <strong id="simMode">Vector</strong></div>
            </div>
            <div class="sim-progress"><div class="sim-progress-bar" id="simProgressBar"></div></div>
            <div class="form-g">
                <label><span data-i18n="sim_speed"></span>: <span id="simSpeedVal">10</span>x</label>
                <input type="range" id="simSpeed" min="1" max="100" value="10">
            </div>
            <div class="row" style="margin-top:8px">
                <button class="btn btn-sm btn-d" id="btnSimStop">⏹</button>
                <button class="btn btn-sm" id="btnSimPause">⏸</button>
            </div>
        </div>
        
        <canvas id="canvas"></canvas>
        <div class="canvas-info">
            <span data-i18n="lbl_objects"></span>: <strong id="objCount">0</strong> | <span id="cursorPos">0, 0</span> <span id="editInfo"></span>
        </div>
    </main>

    <aside id="rightPanel">
        <div class="sec">
            <div class="sec-title" data-i18n="sec_objects"></div>
            <div class="obj-list" id="objList"></div>
            <div class="row" style="margin-top:6px">
                <button class="btn btn-sm" id="btnSelAll" data-i18n="btn_select_all"></button>
                <button class="btn btn-sm" id="btnClear" data-i18n="btn_clear"></button>
            </div>
        </div>

        <div class="sec" id="propSec" style="display:none">
            <div class="sec-title" data-i18n="sec_properties"></div>
            <div class="row">
                <div class="form-g"><label>X</label><input type="number" id="propX" step="0.1"></div>
                <div class="form-g"><label>Y</label><input type="number" id="propY" step="0.1"></div>
            </div>
            <div class="row">
                <div class="form-g"><label data-i18n="lbl_width"></label><input type="number" id="propW" step="0.1"></div>
                <div class="form-g"><label data-i18n="lbl_height"></label><input type="number" id="propH" step="0.1"></div>
            </div>
            <div class="form-g">
                <label><input type="checkbox" id="lockRatio" checked> <span data-i18n="lbl_lock_ratio"></span></label>
            </div>
            <div class="form-g">
                <label><span data-i18n="lbl_rotation"></span>: <span id="rotVal">0</span>°</label>
                <input type="range" id="propRot" min="0" max="360" value="0">
            </div>
            <div class="transform-group">
                <button class="btn btn-sm" id="btnRot90" title="90°">90°</button>
                <button class="btn btn-sm" id="btnRot180" title="180°">180°</button>
                <button class="btn btn-sm" id="btnRot270" title="270°">270°</button>
                <button class="btn btn-sm" id="btnRot0" title="0°">0°</button>
            </div>
            <div class="form-g">
                <label><span data-i18n="lbl_power"></span>: <span id="pwrVal">80</span>%</label>
                <input type="range" id="propPwr" min="1" max="100" value="80">
            </div>
            <div class="form-g">
                <label><span data-i18n="lbl_speed"></span>: <span id="spdVal">1000</span></label>
                <input type="range" id="propSpd" min="100" max="6000" step="50" value="1000">
            </div>
            <div class="form-g">
                <label data-i18n="lbl_passes"></label>
                <input type="number" id="propPass" value="1" min="1">
            </div>
        </div>

        <div class="sec">
            <div class="sec-title" data-i18n="sec_jog"></div>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:3px; max-width:120px; margin:0 auto">
                <div></div><button class="btn btn-sm" data-jog="Y+">▲</button><div></div>
                <button class="btn btn-sm" data-jog="X-">◀</button><button class="btn btn-s btn-sm" data-jog="H">⌂</button><button class="btn btn-sm" data-jog="X+">▶</button>
                <div></div><button class="btn btn-sm" data-jog="Y-">▼</button><div></div>
            </div>
            <div class="row" style="margin-top:6px">
                <button class="btn btn-sm" data-step="0.1">0.1</button>
                <button class="btn btn-sm" data-step="1">1</button>
                <button class="btn btn-sm active" data-step="10">10</button>
            </div>
        </div>

        <div class="sec">
            <button class="btn btn-p btn-block" style="padding:10px; font-size:13px" id="btnStart" data-i18n="btn_start"></button>
            <button class="btn btn-w btn-block btn-sm" style="margin-top:4px" id="btnPause" data-i18n="btn_pause"></button>
        </div>
    </aside>

    <footer>
        <span id="footStatus"></span>
        <div class="progress"><div class="progress-bar" id="progBar"></div></div>
        <span id="footProg">0%</span>
        <div style="flex:1"></div>
        <button class="btn btn-sm" id="btnConsole">📟</button>
    </footer>
</div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu">
    <div class="context-menu-item" data-action="select" data-i18n="ctx_select"></div>
    <div class="context-menu-item" data-action="selectAll" data-i18n="ctx_select_all"></div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="duplicate" data-i18n="ctx_duplicate"></div>

<script>
// ============================================
// CONSTANTS
// ============================================
const RULER_SIZE = 30;

// ============================================
// LANGUAGE SYSTEM
// ============================================
let currentLang = localStorage.getItem('laserLang') || 'it';

function t(key) {
    return (LANG[currentLang] && LANG[currentLang][key]) || (LANG['en'] && LANG['en'][key]) || key;
}

function setLanguage(lang) {
    if (!LANG[lang]) return;
    currentLang = lang;
    localStorage.setItem('laserLang', lang);
    applyTranslations();
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t(el.dataset.i18nTitle);
    });
    document.getElementById('statusTxt').textContent = app?.connected ? t('status_connected') : t('status_disconnected');
    document.getElementById('btnConn').textContent = app?.connected ? t('btn_disconnect') : t('btn_connect');
    document.getElementById('btnStop').textContent = t('btn_stop');
    document.getElementById('footStatus').textContent = t('status_ready');
    document.getElementById('loadingText').textContent = t('msg_processing');
}

function initLanguageSelector() {
    const selector = document.getElementById('langSelector');
    const langs = Object.keys(LANG);
    selector.innerHTML = langs.map(code => 
        `<button class="lang-btn ${code === currentLang ? 'active' : ''}" data-lang="${code}">${LANG[code]._flag || code.toUpperCase()}</button>`
    ).join('');
    selector.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });
}

// ============================================
// LaserObject Class - COORDINATE RELATIVE AL CENTRO
// ============================================
class LaserObject {
    constructor(type, data = {}) {
        this.id = 'obj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        this.type = type;
        this.name = data.name || type + '_' + this.id.substr(-4);
        this.x = data.x || 0;  // ⭐ Può essere negativo (centro = 0,0)
        this.y = data.y || 0;
        this.w = data.w || 50;
        this.h = data.h || 50;
        this.rotation = data.rotation || 0;
        this.flipH = data.flipH || false;
        this.flipV = data.flipV || false;
        this.power = data.power || 80;
        this.speed = data.speed || 1000;
        this.passes = data.passes || 1;
        this.image = data.image || null;
        this.paths = data.paths || [];
        this.selected = false;
        this.selectedPathIndex = -1;
    }

    contains(mx, my) {
        const cx = this.x + this.w / 2;
        const cy = this.y + this.h / 2;
        const rad = -this.rotation * Math.PI / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);
        const dx = mx - cx;
        const dy = my - cy;
        const rx = dx * cos - dy * sin + cx;
        const ry = dx * sin + dy * cos + cy;
        return rx >= this.x && rx <= this.x + this.w && ry >= this.y && ry <= this.y + this.h;
    }

    clone() {
        return new LaserObject(this.type, {
            name: this.name + '_copy', x: this.x + 5, y: this.y + 5, w: this.w, h: this.h,
            rotation: this.rotation, flipH: this.flipH, flipV: this.flipV,
            power: this.power, speed: this.speed, passes: this.passes, image: this.image,
            paths: JSON.parse(JSON.stringify(this.paths))
        });
    }

    getHandles(scale, pan, ppm) {
        // ⭐ pan è il centro (0,0)
        const px = pan.x + this.x * ppm * scale;
        const py = pan.y + this.y * ppm * scale;
        const pw = this.w * ppm * scale;
        const ph = this.h * ppm * scale;
        const s = 8;
        return [
            { id: 'tl', x: px - s/2, y: py - s/2, cursor: 'nw-resize' },
            { id: 'tr', x: px + pw - s/2, y: py - s/2, cursor: 'ne-resize' },
            { id: 'bl', x: px - s/2, y: py + ph - s/2, cursor: 'sw-resize' },
            { id: 'br', x: px + pw - s/2, y: py + ph - s/2, cursor: 'se-resize' },
        ];
    }

    findPathAtPoint(mx, my, tolerance = 3) {
        for (let i = 0; i < this.paths.length; i++) {
            const path = this.paths[i];
            for (let j = 0; j < path.length - 1; j++) {
                const p1x = this.x + path[j].x * this.w;
                const p1y = this.y + path[j].y * this.h;
                const p2x = this.x + path[j+1].x * this.w;
                const p2y = this.y + path[j+1].y * this.h;
                if (this.pointToLineDistance(mx, my, p1x, p1y, p2x, p2y) < tolerance) return i;
            }
        }
        return -1;
    }

    pointToLineDistance(px, py, x1, y1, x2, y2) {
        const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
        const dot = A * C + B * D, lenSq = C * C + D * D;
        let param = lenSq !== 0 ? dot / lenSq : -1;
        let xx, yy;
        if (param < 0) { xx = x1; yy = y1; }
        else if (param > 1) { xx = x2; yy = y2; }
        else { xx = x1 + param * C; yy = y1 + param * D; }
        return Math.sqrt((px - xx) ** 2 + (py - yy) ** 2);
    }

    getTransformedPaths() {
        if (!this.paths.length) return [];
        
        return this.paths.map(path => {
            return path.map(p => {
                let x = p.x;
                let y = p.y;
                
                if (this.flipH) x = 1 - x;
                if (this.flipV) y = 1 - y;
                
                if (this.rotation !== 0) {
                    const rad = this.rotation * Math.PI / 180;
                    const cos = Math.cos(rad);
                    const sin = Math.sin(rad);
                    const cx = x - 0.5;
                    const cy = y - 0.5;
                    const newX = cx * cos - cy * sin + 0.5;
                    const newY = cx * sin + cy * cos + 0.5;
                    x = Math.max(0, Math.min(1, newX));
                    y = Math.max(0, Math.min(1, newY));
                } else {
                    x = Math.max(0, Math.min(1, x));
                    y = Math.max(0, Math.min(1, y));
                }
                
                return { x, y };
            });
        });
    }
}

// ============================================
// LaserCAM Class - FULL RELATIVE MODE
// ============================================
class LaserCAM {
    constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.objects = [];
        this.selected = null;
        
        this.zoom = 1;
        this.pan = { x: 0, y: 0 };  // ⭐ Calcolato in resize()
        this.ppm = 2;
        this.workArea = { w: 300, h: 300 };
        
        this.resizing = false;
        this.resizeHandle = null;
        this.resizeStart = {};
        this.dragging = false;
        this.dragStart = { x: 0, y: 0 };
        
        this.port = null;
        this.reader = null;
        this.writer = null;
        this.connected = false;
        this.jobRunning = false;
        this.jobPaused = false;
        this.jobQueue = [];
        
        this.machine = this.loadMachine();
        this.presets = this.loadPresets();
        this.jogStep = 10;
        
        this.homePosition = { x: 0, y: 0 };  // ⭐ Home è sempre 0,0
        this.currentPosition = { x: 0, y: 0 };
        this.positionKnown = false;  // ⭐ NUOVO
        this.positionUpdateInterval = null;
        
        this.simulating = false;
        this.simPaused = false;
        this.simSpeed = 10;
        this.simData = null;
        this.simAnimationId = null;
        this.simMode = 'vector';
        
        this.editMode = false;
        this.editingObject = null;
        this.contextMenuPos = { x: 0, y: 0 };
        
        this.rasterRes = 10;
        this.rasterBidir = true;
        
        this.pathColors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dfe6e9', '#fd79a8', '#a29bfe', '#00b894', '#e17055'];
        
        this.vectorFonts = this.initVectorFonts();
        
        this.init();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupEvents();
        this.renderPresets();
        this.render();
        this.applyMachineProfile();
        this.updateCurrentPosDisplay();
    }

    // ⭐ RESIZE - Centra area di lavoro
    resize() {
        const parent = document.getElementById('canvasParent');
        this.canvas.width = parent.clientWidth;
        this.canvas.height = parent.clientHeight;
        
        // Centra l'area con 0,0 al centro
        this.pan = {
            x: (this.canvas.width + RULER_SIZE) / 2,
            y: (this.canvas.height + RULER_SIZE) / 2
        };
        
        this.render();
    }

    updateCurrentPosDisplay() {
        const x = this.currentPosition.x.toFixed(3);
        const y = this.currentPosition.y.toFixed(3);
        document.getElementById('currentPosText').textContent = `X${x} Y${y}`;
    }

    // ========== RENDER - SISTEMA CENTRATO ==========
    render() {
        const ctx = this.ctx;
        const W = this.canvas.width, H = this.canvas.height;
        
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        const scale = this.ppm * this.zoom;
        const halfW = this.workArea.w / 2;
        const halfH = this.workArea.h / 2;
        
        // Area di lavoro centrata (0,0 = centro)
        const areaLeft = this.pan.x - halfW * scale;
        const areaTop = this.pan.y - halfH * scale;
        const areaW = this.workArea.w * scale;
        const areaH = this.workArea.h * scale;
        
        this.drawRulers(ctx, scale, halfW, halfH);
        
        // Background
        ctx.fillStyle = '#0a0f18';
        ctx.fillRect(areaLeft, areaTop, areaW, areaH);
        
        // Griglia
        ctx.strokeStyle = '#1a2030';
        ctx.lineWidth = 1;
        const gridMM = this.zoom < 0.5 ? 50 : this.zoom < 1 ? 20 : 10;
        
        for (let x = -halfW; x <= halfW; x += gridMM) {
            const px = this.pan.x + x * scale;
            ctx.beginPath(); 
            ctx.moveTo(px, areaTop); 
            ctx.lineTo(px, areaTop + areaH); 
            ctx.stroke();
        }
        for (let y = -halfH; y <= halfH; y += gridMM) {
            const py = this.pan.y + y * scale;
            ctx.beginPath(); 
            ctx.moveTo(areaLeft, py); 
            ctx.lineTo(areaLeft + areaW, py); 
            ctx.stroke();
        }
        
        // ⭐ Assi centrali (X e Y attraverso 0,0)
        ctx.strokeStyle = '#3a5a3a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.pan.x, areaTop);
        ctx.lineTo(this.pan.x, areaTop + areaH);
        ctx.moveTo(areaLeft, this.pan.y);
        ctx.lineTo(areaLeft + areaW, this.pan.y);
        ctx.stroke();
        
        // Bordo area
        ctx.strokeStyle = '#3a4a6a';
        ctx.lineWidth = 2;
        ctx.strokeRect(areaLeft, areaTop, areaW, areaH);

        this.drawHomeMarker(ctx, scale);
        this.drawCurrentPosMarker(ctx, scale);
        
        this.objects.forEach(obj => this.drawObject(obj));
        
        if (this.simulating && this.simData?.currentPoint) {
            this.drawLaserPoint(ctx, scale, this.simData.currentPoint, this.simData.laserOn);
        }
        
        document.getElementById('objCount').textContent = this.objects.length;
        document.getElementById('editInfo').textContent = this.editMode && this.editingObject ? 
            `| ${t('editing')}: ${this.editingObject.paths.length} paths` : '';
    }

    // ⭐ RULERS - Con coordinate negative/positive
    drawRulers(ctx, scale, halfW, halfH) {
        const W = this.canvas.width, H = this.canvas.height;
        
        ctx.fillStyle = '#1a2530';
        ctx.fillRect(0, 0, W, RULER_SIZE);
        ctx.fillRect(0, RULER_SIZE, RULER_SIZE, H - RULER_SIZE);
        
        ctx.fillStyle = '#252f3f';
        ctx.fillRect(0, 0, RULER_SIZE, RULER_SIZE);
        
        ctx.fillStyle = '#6c7a89';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('0', RULER_SIZE/2, RULER_SIZE/2);
        
        let majorTick = 50, minorTick = 10;
        if (this.zoom > 1.5) { majorTick = 20; minorTick = 5; }
        if (this.zoom > 3) { majorTick = 10; minorTick = 2; }
        if (this.zoom < 0.5) { majorTick = 100; minorTick = 20; }
        
        ctx.strokeStyle = '#4a5a6a';
        ctx.fillStyle = '#8a9aaa';
        ctx.font = '8px sans-serif';
        
        // ⭐ Righello X con negativi e positivi
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (let mm = -halfW; mm <= halfW; mm += minorTick) {
            const px = this.pan.x + mm * scale;
            if (px < RULER_SIZE || px > W) continue;
            const isMajor = mm % majorTick === 0;
            ctx.beginPath();
            ctx.moveTo(px, RULER_SIZE - (isMajor ? 10 : 5));
            ctx.lineTo(px, RULER_SIZE);
            ctx.stroke();
            if (isMajor) ctx.fillText(mm.toString(), px, RULER_SIZE - 18);
        }
        
        // ⭐ Righello Y con negativi e positivi
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let mm = -halfH; mm <= halfH; mm += minorTick) {
            const py = this.pan.y + mm * scale;
            if (py < RULER_SIZE || py > H) continue;
            const isMajor = mm % majorTick === 0;
            ctx.beginPath();
            ctx.moveTo(RULER_SIZE - (isMajor ? 10 : 5), py);
            ctx.lineTo(RULER_SIZE, py);
            ctx.stroke();
            if (isMajor) ctx.fillText(mm.toString(), RULER_SIZE - 12, py);
        }
        
        ctx.strokeStyle = '#3a4a6a';
        ctx.beginPath();
        ctx.moveTo(RULER_SIZE, 0); ctx.lineTo(RULER_SIZE, H);
        ctx.moveTo(0, RULER_SIZE); ctx.lineTo(W, RULER_SIZE);
        ctx.stroke();
    }

    // ⭐ HOME MARKER - Sempre al centro (0,0)
    drawHomeMarker(ctx, scale) {
        const hx = this.pan.x;
        const hy = this.pan.y;
        
        ctx.save();
        ctx.strokeStyle = '#00ff00';
        ctx.fillStyle = '#00ff00';
        ctx.lineWidth = 2;
        
        // Croce grande
        ctx.beginPath();
        ctx.moveTo(hx - 15, hy); ctx.lineTo(hx + 15, hy);
        ctx.moveTo(hx, hy - 15); ctx.lineTo(hx, hy + 15);
        ctx.stroke();
        
        // Cerchio
        ctx.beginPath(); 
        ctx.arc(hx, hy, 8, 0, Math.PI * 2); 
        ctx.stroke();
        
        // Labels
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('HOME', hx + 14, hy - 10);
        ctx.fillText('(0,0)', hx + 14, hy + 4);
        ctx.restore();
    }

    // ⭐ CURRENT POSITION MARKER
    drawCurrentPosMarker(ctx, scale) {
        if (!this.positionKnown) return;
        
        const px = this.pan.x + this.currentPosition.x * scale;
        const py = this.pan.y + this.currentPosition.y * scale;
        
        ctx.save();
        ctx.strokeStyle = '#ff9900';
        ctx.fillStyle = '#ff9900';
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        ctx.moveTo(px - 8, py); ctx.lineTo(px + 8, py);
        ctx.moveTo(px, py - 8); ctx.lineTo(px, py + 8);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText('LASER', px + 10, py - 5);
        ctx.restore();
    }

    drawLaserPoint(ctx, scale, point, laserOn) {
        const px = this.pan.x + point.x * scale;
        const py = this.pan.y + point.y * scale;
        ctx.save();
        if (laserOn) {
            const gradient = ctx.createRadialGradient(px, py, 0, px, py, 18);
            gradient.addColorStop(0, 'rgba(255, 50, 50, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 50, 50, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 50, 50, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    // ⭐ DRAW OBJECT - Coordinate relative al centro
    drawObject(obj) {
        const ctx = this.ctx;
        const scale = this.ppm * this.zoom;
        
        // obj.x e obj.y sono relativi al centro
        const px = this.pan.x + obj.x * scale;
        const py = this.pan.y + obj.y * scale;
        const pw = obj.w * scale;
        const ph = obj.h * scale;
        const cx = px + pw / 2;
        const cy = py + ph / 2;

        ctx.save();
        
        ctx.translate(cx, cy);
        ctx.rotate(obj.rotation * Math.PI / 180);
        ctx.scale(obj.flipH ? -1 : 1, obj.flipV ? -1 : 1);
        ctx.translate(-cx, -cy);
        
        if ((obj.type === 'image' || obj.type === 'text') && obj.image) {
            ctx.drawImage(obj.image, px, py, pw, ph);
        } else if ((obj.type === 'vector' || obj.type === 'vectorText') && obj.paths.length > 0) {
            obj.paths.forEach((path, pathIndex) => {
                if (this.editMode && this.editingObject === obj) {
                    ctx.strokeStyle = this.pathColors[pathIndex % this.pathColors.length];
                    ctx.lineWidth = obj.selectedPathIndex === pathIndex ? 4 : 2;
                    if (obj.selectedPathIndex === pathIndex) {
                        ctx.shadowColor = ctx.strokeStyle;
                        ctx.shadowBlur = 8;
                    }
                } else {
                    ctx.strokeStyle = obj.selected ? '#00d4ff' : '#fff';
                    ctx.lineWidth = obj.selected ? 2 : 1;
                }
                
                ctx.beginPath();
                path.forEach((p, i) => {
                    const vx = px + p.x * pw;
                    const vy = py + p.y * ph;
                    i === 0 ? ctx.moveTo(vx, vy) : ctx.lineTo(vx, vy);
                });
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
        }

        ctx.restore();

        if (obj.selected && !this.editMode) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(obj.rotation * Math.PI / 180);
            ctx.translate(-cx, -cy);
            
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px - 2, py - 2, pw + 4, ph + 4);
            ctx.setLineDash([]);
            
            ctx.restore();
            
            ctx.fillStyle = '#00d4ff';
            obj.getHandles(this.zoom, this.pan, this.ppm).forEach(h => ctx.fillRect(h.x, h.y, 8, 8));
        }
    }

    // ⭐ SET HOME FROM CURRENT - Invia G92 X0 Y0
    async setHomeFromCurrent() {
        if (!this.connected) {
            this.log('❌ Not connected to machine', 'err');
            return;
        }
        
        // Invia G92 per resettare le coordinate macchina
        await this.send('G92 X0 Y0');
        await this.delay(200);
        
        // Reset tracking
        this.currentPosition = { x: 0, y: 0 };
        this.homePosition = { x: 0, y: 0 };
        this.positionKnown = true;
        
        this.updateCurrentPosDisplay();
        this.log('✅ Home set at current position (G92 X0 Y0 sent). This is now CENTER (0,0)');
        this.render();
    }
    
    saveHomePosition() {
        // In modalità relativa, questo è alias di setHomeFromCurrent
        this.setHomeFromCurrent();
    }
    
    // ⭐ GO HOME - Movimento relativo verso 0,0
    async goHome() { 
        if (!this.connected) {
            this.log('❌ Not connected', 'err');
            return;
        }
        
        if (!this.positionKnown) {
            this.log('⚠️ Position unknown. Set home first or jog to known position.', 'warn');
            return;
        }
        
        // Calcola movimento relativo per tornare a 0,0
        const dx = -this.currentPosition.x;
        const dy = -this.currentPosition.y;
        
        if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) {
            this.log('Already at home (0,0)');
            return;
        }
        
        await this.send('G91');
        await this.send(`G0 X${dx.toFixed(3)} Y${dy.toFixed(3)} F3000`);
        
        this.currentPosition = { x: 0, y: 0 };
        this.updateCurrentPosDisplay();
        this.log('↩️ Returned to home (0,0)');
        this.render();
    }
